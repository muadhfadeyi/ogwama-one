<!DOCTYPE html>
<html lang="en">
<head>

            <path d="M9.5 16.5C9.5 12.6 12.6 9.5 18.5 9.5C18.5 15.4 15.4 18.5 11.5 18.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

          </svg>
        </span>
        <span class="brand-text">OGWAMA <span>One</span></span>
      </a>

      <nav class="nav-segmented" id="mainNav" aria-label="Primary">
        <button class="nav-tab active" data-view="dashboard">Overview</button>
        <button class="nav-tab" data-view="splitpay">Split Pay</button>
        <button class="nav-tab" data-view="licensing">

        <button class="nav-tab" data-view="verify">QR Verify</button>

        <span class="zero-pill">&#8358;0 Upfront to Govt</span>
        <a class="nav-proposal-btn" href="../proposal/OGWAMA-Digital-Transformation-Proposal.html" target="_blank" rel="noopener">Proposal</a>

  <!-- MAIN CANVAS -->
  <main class="page-wrap" id="appContent">
    <!-- Rendered dynamically by app.js -->
  </main>

  <footer class="page-footer">

      <span>Solid Waste Mandate &bull; Polluter Pays &bull; Self-Funded Convenience Fee Model</span>

  </footer>

  <!-- APPLE SHEET MODAL -->
  <div class="sheet-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <div class="sheet-header">
        <h3 id="modalTitle">Details</h3>
        <button class="sheet-close" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <div class="sheet-body" id="modalBody"></div>
    </div>
  </div>

  <!-- FLOATING DYNAMIC-ISLAND STYLE TOAST -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
